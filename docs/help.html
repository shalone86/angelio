<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angelio Help &amp; Screenshots</title>
  <style>
    :root {
      --bg: #f2f9ff; --card: #fff; --ink: #183153; --muted: #4b6584; --line: #cfe6fb;
      --accent: #2f4a7a; --sun: #ffc93c; --sun-ink: #4a3300; --pill: #e7f2fe; --mark: #fff0a6;
      --code-bg: #eef5fc; --shadow: 0 4px 0 var(--line);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1b2e; --card: #16263f; --ink: #edf4ff; --muted: #a6bddb; --line: #284266;
        --accent: #6ea8fe; --sun: #f6c445; --sun-ink: #2c1e00; --pill: #203556; --mark: #6b5300;
        --code-bg: #102036; --shadow: 0 4px 0 #091322;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15.5px/1.5 system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    code { font: 0.86em/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 6px; border: 1px solid var(--line); }
    header { background: var(--card); border-bottom: 2px solid var(--line); padding: 16px; position: sticky; top: 0; z-index: 10; }
    .wrap, main, footer { max-width: 980px; margin: 0 auto; }
    .title-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
    h1 { margin: 0; font-size: 1.45rem; }
    .doc-links { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.9rem; }
    .sub { margin: 4px 0 12px; color: var(--muted); font-size: 0.92rem; }
    .search-row { display: flex; gap: 8px; }
    .search-box { flex: 1; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 3px 10px; }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box input { width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 5px; outline: none; }
    .clear-btn { border: 0; border-radius: 10px; padding: 7px 14px; background: var(--pill); color: var(--ink); font: 700 0.9rem inherit; cursor: pointer; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill { border: 1.5px solid var(--line); background: var(--pill); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 700 0.84rem inherit; cursor: pointer; }
    .pill[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
    main { padding: 12px 16px 40px; }
    .meta-bar { display: flex; justify-content: space-between; margin: 4px 0 10px; color: var(--muted); font-size: 0.86rem; }
    kbd { font: 0.8em ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); }
    .grid { display: grid; gap: 12px; }
    .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
    .card-top { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .card h2 { margin: 0; font-size: 1.08rem; }
    .badge { font-size: 0.74rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--pill); color: var(--accent); }
    .summary { margin: 0 0 8px; color: var(--muted); font-size: 0.93rem; }
    .bullets { margin: 0; padding-left: 18px; }
    .bullets li { margin: 3px 0; }
    .card-img { display: block; width: 100%; max-height: 290px; object-fit: cover; object-position: top; border-radius: 12px; border: 1px solid var(--line); margin-top: 10px; background: var(--bg); }
    .card-img.mobile { max-width: 260px; max-height: none; }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
    .empty { background: var(--card); border: 2px dashed var(--line); border-radius: 16px; padding: 24px; text-align: center; color: var(--muted); }
    footer { padding: 0 16px 32px; color: var(--muted); font-size: 0.86rem; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title-row">
      <h1>Angelio Help &amp; Screenshots</h1>
      <nav class="doc-links">
        <a href="./README.md">Docs</a>
        <a href="./games-guide.md">Games Handbook</a>
        <a href="./tech-help.md">Tech Help</a>
        <a href="./selling-codes.md">Codes</a>
        <a href="../ROADMAP.md">Roadmap</a>
      </nav>
    </div>
    <p class="sub">Offline quick reference for games, stickers, <code>#/</code> URLs, voxel markers, deploys, and fixes.</p>
    <div class="search-row">
      <div class="search-box"><input id="q" type="search" placeholder="Search stickers, voxel, #/, sw.js, TDZ, garden, usher..." aria-label="Search help"></div>
      <button type="button" class="clear-btn" id="clearBtn">Clear</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Categories"></div>
  </div>
</header>
<main>
  <div class="meta-bar"><span id="count"></span><span><kbd>/</kbd> search · <kbd>Esc</kbd> clear</span></div>
  <section class="grid" id="results" aria-live="polite"></section>
</main>
<footer>Offline via <code>file://</code> · Live: <a href="https://angelio.org/games/">angelio.org/games/</a></footer>
<script>
(() => {
  const CATEGORIES = [
    { id: "all", label: "All" },
    { id: "games", label: "Games" },
    { id: "urls", label: "URLs & Stack" },
    { id: "art", label: "Voxel & Audio" },
    { id: "fixes", label: "Fixes" }
  ];

  const ITEMS = [
    {
      cat: "games", badge: "Games", title: "Stickers & Rewards (Voxel vs 2D)",
      summary: "Arcade games give isometric voxel stickers by stars; learning apps give 2D stickers by mistakes.",
      img: "./img/sticker-world.png",
      bullets: [
        "5 Arcade games (byStars: true): 3★ = giant voxel sticker (mistakes ignored), 2★ = mini voxel sticker, 0–1★ = no new sticker.",
        "18 voxel SVGs (vox:<slug>) live in hub/public/stickers/vox/; unowned ones drop first across angelio:stickers.",
        "9 Learning apps: 0 mistakes = giant 2D sticker, 1+ mistakes = mini 2D sticker (no voxel stickers)."
      ],
      keywords: "stickers voxel 2d byStars giant mini reward world"
    },
    {
      cat: "games", badge: "Games", title: "Option A Game Homes (Desktop & Mobile)",
      summary: "Uniform stage cards (including Endless) that scale up at >=1024px and switch cleanly to 2 columns on phones.",
      img: "./img/usher-home-desktop.png",
      bullets: [
        "Locked stage cards show their unlock requirement and don't launch.",
        "Locked character pills reveal their unlock requirement in the perk line without switching your active pick.",
        "Arcade sticker bar shows sticker count ('My voxel stickers · N stickers'), never '0 solved'."
      ],
      keywords: "home screen mobile desktop layout option a endless cards locked"
    },
    {
      cat: "games", badge: "Games", title: "Candle Rack (/candles/)",
      summary: "Light vigil candles before Mass, oil the Sanctuary Lamp, relight your taper on stages 2+.",
      img: "./img/candles-home.png",
      bullets: [
        "Has NO character picker (uses active liturgical season chip instead).",
        "Stages: Sunday Mass, Divine Liturgy, Christmas Midnight Mass, Pascha (starts dark), Adoration Endless (4 racks / 32 spots).",
        "Edit prop spots live at /studio/candles/."
      ],
      keywords: "candles rack adoration taper lamp studio"
    },
    {
      cat: "games", badge: "Games", title: "Mass Usher (/usher/)",
      summary: "Walk families to pews and swipe pews to scoot parishioners so families fit together.",
      img: "./img/usher-home-mobile.png", imgClass: "mobile",
      bullets: [
        "10 pts seated vs 4 pts back-row standing (+3 quick bonus <= 8 s).",
        "📌 stayers won't scoot unless playing Respected Usher.",
        "4 timed stages + Adoration Endless (ends at 6 waiting families); 4 all-male ushers."
      ],
      keywords: "usher pews scoot stayers mobile adoration"
    },
    {
      cat: "games", badge: "Games", title: "Monastery Porter (/porter/)",
      summary: "One decision per visitor: Welcome (W/Up/Space/tap gate) or Send away (S/Left/Right/swipe).",
      img: "./img/porter-home.png",
      bullets: [
        "Wait when outgoing brothers cross the gate or your combo drops.",
        "Stages: Sunday Mass, Guest Day, The Great Silence, Feast Day Crowd (Endless).",
        "2 starters + 6 unlockable monks & nuns."
      ],
      keywords: "porter gate welcome send away monks nuns"
    },
    {
      cat: "games", badge: "Games", title: "Saints Match (/match/)",
      summary: "Memory cards across 36 saints with 2 s opening peek, Feast Rush (2x), and Wind Swaps.",
      img: "./img/match-home.png",
      bullets: [
        "Per-card flip speech is muted on purpose so fast flips never stutter audio.",
        "Strict 3M / 3F parity after The Apostles; All Saints Rush Endless adds time per match (45 s cap).",
        "Altar Server starter + 6 Patron Helpers."
      ],
      keywords: "match saints feast rush wind swap mute tts"
    },
    {
      cat: "games", badge: "Games", title: "Garden Givers (/garden/)",
      summary: "Shoo critters off beds, trees & herbs and pick Food Bank orders before rewards go negative.",
      img: "./img/garden-home.png",
      bullets: [
        "1 tap bugs/birds; 2 taps squirrels & raccoons. Up to 2 courier helpers walk baskets around tree colliders (r = 4.4).",
        "Night Vigil protects everything with no picking/orders; Endless ends at 10 eaten crops.",
        "Stars: 1★ play, 250/425 timed (0:45), 500/1600 Endless. 2 starters + 4 unlockable gardeners."
      ],
      keywords: "garden critters 2 taps orchard food bank endless"
    },
    {
      cat: "urls", badge: "URLs & Stack", title: "Why links use #/ (and Ghost comparison)",
      summary: "Cloudflare routes folders (/garden/); kit/router.js handles #/play/... offline in the browser.",
      img: "./img/hub-games.png",
      bullets: [
        "Nothing after # hits the server, so relative css/js paths and single-file sw.js offline shells work across 14 Workers.",
        "Ghost uses real server URLs for SEO/blog sharing; game sub-screens don't need indexing."
      ],
      keywords: "hash #/ router ghost seo offline sw"
    },
    {
      cat: "urls", badge: "URLs & Stack", title: "Workers, kit/ Sync & Daily Commands",
      summary: "1 hub + 14 Workers; edit kit/ once and sync everywhere.",
      bullets: [
        "npm test — strict kit-check + all 17 test suites.",
        "npm run kit-sync — copy kit/ edits into all apps (remember to bump sw.js VERSION).",
        "git pull --rebase origin main — pull nightly Studio backups before pushing.",
        "npm run deploy -- <app> — deploy Worker (refuses dirty git)."
      ],
      keywords: "kit-sync kit-check deploy commands rebase workers"
    },
    {
      cat: "art", badge: "Voxel & Audio", title: "MagicaVoxel Markers (looks.js)",
      summary: "Reserved marker hexes recolor per person or liturgical season automatically.",
      bullets: [
        "Hair #255359 · Eyes #0066ff/#0b346e · Skin #cccc99/#fad689.",
        "Shirt #ffcc99 · Dress #ff9966 · Belt #ff9999 · Shoes #ffcccc.",
        "Roman Chasuble #ff77a8 · Byzantine Phelonion #ffcc66 (don't use elsewhere).",
        "Unuploaded slugs show box stand-ins; missing -idle holds walkers on frame 0."
      ],
      keywords: "vox magicavoxel hex marker recolor looks.js idle"
    },
    {
      cat: "fixes", badge: "Fixes", title: "Common Troubleshooting",
      summary: "Fast Symptom → Fix checks before editing code.",
      bullets: [
        "Stale deploy cache: Bump sw.js VERSION, commit, redeploy; hard-refresh.",
        "Black screen: Check Console for TDZ ('before initialization') and move helper defs up.",
        "Wild finish sticker: Never name any @keyframes 'bob' in apps/*/public/css/app.css.",
        "Push rejected / deploy refused: Commit cleanly and run git pull --rebase origin main."
      ],
      keywords: "cache sw.js tdz black screen bob keyframe deploy push"
    }
  ];

  const state = { cat: "all", q: "" };
  const qEl = document.getElementById("q"), clearEl = document.getElementById("clearBtn"), filtersEl = document.getElementById("filters"), countEl = document.getElementById("count"), resultsEl = document.getElementById("results");
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const hi = (t, terms) => terms.length ? esc(t).replace(new RegExp(`(${terms.map(reEsc).join("|")})`, "ig"), "<mark>$1</mark>") : esc(t);
  const match = (it, terms) => (state.cat === "all" || it.cat === state.cat) && (!terms.length || terms.every((t) => `${it.title} ${it.summary} ${it.bullets.join(" ")} ${it.keywords}`.toLowerCase().includes(t)));

  function renderFilters() {
    filtersEl.innerHTML = CATEGORIES.map((c) => `<button type="button" class="pill" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${c.label}</button>`).join("");
  }
  function render() {
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const found = ITEMS.filter((it) => match(it, terms));
    countEl.textContent = `${found.length} / ${ITEMS.length} topics`;
    resultsEl.innerHTML = found.length ? found.map((it) => `<article class="card">
      <div class="card-top"><h2>${hi(it.title, terms)}</h2><span class="badge">${esc(it.badge)}</span></div>
      <p class="summary">${hi(it.summary, terms)}</p>
      <ul class="bullets">${it.bullets.map((b) => `<li>${hi(b, terms)}</li>`).join("")}</ul>
      ${it.img ? `<img class="card-img${it.imgClass ? ` ${it.imgClass}` : ""}" src="${it.img}" alt="${esc(it.title)}" loading="lazy">` : ""}
    </article>`).join("") : `<div class="empty">No matches for "${esc(state.q.trim())}".</div>`;
  }
  filtersEl.onclick = (e) => { const b = e.target.closest("[data-cat]"); if (!b) return; state.cat = b.dataset.cat; renderFilters(); render(); };
  qEl.oninput = () => { state.q = qEl.value; render(); };
  clearEl.onclick = () => { state.q = ""; state.cat = "all"; qEl.value = ""; renderFilters(); render(); qEl.focus(); };
  document.onkeydown = (e) => {
    if (e.key === "/" && document.activeElement !== qEl && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); qEl.focus(); qEl.select(); }
    else if (e.key === "Escape" && (state.q || state.cat !== "all")) clearEl.click();
  };
  renderFilters(); render();
})();
</script>
</body>
</html>
