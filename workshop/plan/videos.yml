# The video checklist: every video that finishes the set (the stopping point in the Angelio ROADMAP.md, "Videos: the
# stopping point"): about 45 lessons on the four pillars, plus about 25 church history stops. A DRAFT for Shalone to
# change: add, cut, merge, reorder. The workshop's Home shows it (studio/index.html, /api/plan).
#
# Each video:
#   id        its lesson id in Watch & Sing (a redo keeps the old video's id, so links and stars keep working)
#   title     what it's called
#   course    the workshop course it's made in (courses/<course>/)
#   replaces  the old Watch & Sing video(s) it takes the place of; the first is the one whose place it takes, the rest are
#             folded into it and hidden when it's sent
#   old       the old script(s) to start from (plan/old-scripts/<id>.txt), when it isn't the same as `replaces`
#   lesson    the lesson folder once it exists (<course>/<folder>)
#   status    todo → script (drafted by Claude, quotes checked) → approved (he approved the script and quiz) →
#             recorded → done (sent to Watch & Sing)
#   note      anything to remember
#   voxels    characters and props to make in MagicaVoxel (shown on Home; copied to lesson.yml when drafted)
#
# Quotations: the Catechism (CCC) or Christ – Our Pascha (CoP) for the great majority, linked; the Catholic Encyclopedia
# for history; East and West side by side where they differ.

courses:
  believe: {title: "What We Believe", pillar: 1}
  celebrate: {title: "How We Celebrate", pillar: 2}
  live: {title: "How We Live", pillar: 3}
  pray: {title: "How We Pray", pillar: 4}
  history: {title: "The Church Through the Ages", pillar: history}

