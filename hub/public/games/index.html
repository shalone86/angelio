<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Angelio Games</title>
  <meta name="description" content="Free Catholic games for kids from Angelio: get the church ready before Mass, seat the families, and more coming.">
  <meta name="theme-color" content="#7b4fd6">
  <link rel="icon" href="/games/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/games/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Angelio Games">
  <link rel="manifest" href="/games/manifest.webmanifest">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/hub.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div></div>
<main>
  <header class="section-header">
    <a class="section-feather" href="/" aria-label="Angelio home" title="Angelio home"><img src="/icon.svg" alt="" width="34" height="34"></a>
    <a class="section-feather" href="/games/" aria-current="page" aria-label="Angelio Games home" title="Angelio Games home"><img src="/games/icon.svg" alt="" width="34" height="34"></a>
    <a class="bell-pill" id="bell-pill" href="/games/diorama/" aria-label="Parish Bells and Voxel Diorama"></a>
  </header>
  <section class="hero">
    <span class="feather" aria-hidden="true">🎮</span>
    <h1>Pick a game!</h1>
    <p class="lede">Games in and around the church. Tap 🔊 to hear what a game is.</p>
  </section>
  <section class="game-tiles" id="games" aria-label="Games"></section>
  <section class="diorama-banner" id="diorama-banner" aria-label="Prize Box and Voxel Diorama"></section>
  <h2 class="gu-title">Coming soon</h2>
  <section class="game-tiles" id="soon" aria-label="Coming soon"></section>
  <p class="sticker-world-action"><a class="sticker-world-button" href="/stickers/">🌍 Play in Sticker World</a></p>
  <footer><p><a href="/">All of Angelio</a> · <a href="/privacy">Privacy</a></p></footer>
</main>
<script type="module" src="/games/games.js"></script>
</body>
</html>
