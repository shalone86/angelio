<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lead sheet · Angelio</title>
  <meta name="theme-color" content="#ff7a59">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/nunito-400-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/baloo2-400-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/leadsheet.css">
  <style>
    body { margin: 0; background: #f3efe6; font-family: Nunito, system-ui, sans-serif; color: #1d2433; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; position: sticky; top: 0; background: #f3efe6ee; z-index: 2; }
    .bar a, .bar button, .bar label { font: 800 1rem Nunito, sans-serif; border: 0; border-radius: 99px; padding: 9px 16px; background: #fff; color: inherit; text-decoration: none; cursor: pointer; box-shadow: 0 3px 0 #e2d8c4; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
    .bar .key b { min-width: 2.6em; text-align: center; }
    .bar .key button { box-shadow: none; background: #f3efe6; padding: 4px 12px; min-height: 36px; }
    .bar .print { background: #ff7a59; color: #fff; box-shadow: 0 3px 0 #c4502f; }
    main { padding: 0 0 40px; }
    .msg { text-align: center; padding: 60px 16px; }
  </style>
</head>
<body>
  <div class="bar no-print">
    <a href="javascript:history.length > 1 ? history.back() : location.assign('/watch/')">← Back</a>
    <span class="key" aria-label="Key"><button type="button" data-t="-1" aria-label="Key down">−</button><b id="key">C</b><button type="button" data-t="1" aria-label="Key up">+</button></span>
    <label><input type="checkbox" id="over" checked> Chords over words</label>
    <button type="button" class="print" onclick="print()">🖨 Print</button>
  </div>
  <main id="sheet"><p class="msg">Loading…</p></main>
  <script src="/vendor/abcjs-6.7.2/abcjs-basic-min.js"></script>
  <script type="module">
    import { renderSheet, keyName } from "/js/leadsheet.js";
    const id = new URLSearchParams(location.search).get("id");
    const el = document.getElementById("sheet");
    let data, transpose = 0;
    try { transpose = Number(sessionStorage.getItem(`ls:t:${id}`)) || 0; } catch { /* ignore */ }
    const draw = () => {
      renderSheet(el, data, { transpose, chordsOverWords: document.getElementById("over").checked });
      document.getElementById("key").textContent = keyName(data.key || "C", transpose);
      document.title = `${data.title} · lead sheet`;
    };
    document.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => {
      transpose = ((transpose + Number(b.dataset.t) + 17) % 12) - 5; // −5 … +6
      try { sessionStorage.setItem(`ls:t:${id}`, transpose); } catch { /* ignore */ }
      draw();
    });
    document.getElementById("over").onchange = draw;
    let wide = innerWidth >= 700; // the staff has 3 bars to a line on wide screens, 2 on phones
    addEventListener("resize", () => { if (data && (innerWidth >= 700) !== wide) { wide = innerWidth >= 700; draw(); } });
    try {
      const r = await fetch(`/api/leadsheet?id=${encodeURIComponent(id ?? "")}`);
      if (!r.ok) throw new Error();
      data = await r.json();
      await document.fonts.ready;
      draw();
    } catch { el.innerHTML = `<p class="msg">This song doesn't have a lead sheet yet.</p>`; }
  </script>
</body>
</html>
