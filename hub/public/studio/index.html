<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angelio Studio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2f4a7a">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/nunito-400-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --ink: #1d2433; --muted: #66708a; --line: #e3e7ef; --bg: #f4f6fa; --card: #fff; --accent: #ff7a59; --blue: #2f6fd6; --bad: #d4383e; --good: #138a48; --warn: #a86400; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 15px/1.45 Nunito, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { border: 0; border-radius: 99px; padding: 8px 14px; background: #eef1f7; cursor: pointer; font-weight: 800; min-height: 40px; }
    button:hover { filter: brightness(.97); }
    button.main { background: var(--accent); color: #fff; }
    button.blue { background: var(--blue); color: #fff; }
    button.ghost { background: none; }
    a.btn { display: inline-flex; align-items: center; border-radius: 99px; padding: 8px 14px; background: #eef1f7; color: inherit; text-decoration: none; min-height: 40px; white-space: nowrap; }
    button.small { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
    button.danger { color: var(--bad); }
    button:disabled { opacity: .45; cursor: default; }
    input[type=text], input:not([type]), input[type=date], input[type=search], select, textarea { width: 100%; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); }
    label.f { display: block; font-weight: 800; font-size: .82rem; margin: 10px 0 3px; }
    .muted { color: var(--muted); font-size: .88rem; }
    .row { display: flex; gap: 8px; align-items: center; } .row > .grow { flex: 1; min-width: 0; }
    [hidden] { display: none !important; }
    /* top */
    header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #2f4a7a; color: #fff; flex-wrap: wrap; }
    header h1 { margin: 0; font: 800 1.15rem "Baloo 2", Nunito, sans-serif; display: flex; align-items: center; gap: 8px; }
    header h1 img { width: 28px; height: 28px; border-radius: 8px; }
    header .space { flex: 1; }
    header #state { font-weight: 700; font-size: .9rem; opacity: .9; }
    header button { background: #ffffff22; color: #fff; }
    header button.main { background: var(--accent); }
    /* three columns */
    .cols { display: grid; grid-template-columns: 290px minmax(380px, 1fr) 420px; height: calc(100% - 56px); }
    .cols > section { overflow: auto; }
    @media (max-width: 1250px) { .cols { grid-template-columns: 260px 1fr; } #previewCol { grid-column: 1 / -1; } .cols { height: auto; } }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
    #listCol { background: #fff; border-right: 2px solid var(--line); padding: 10px; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .tabs button { padding: 6px 10px; min-height: 34px; font-size: .88rem; }
    .tabs button.on { background: var(--ink); color: #fff; }
    .item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border-radius: 12px; padding: 6px; min-height: 0; font-weight: 700; }
    .item.on { background: #e8efff; }
    .item img, .item .noimg { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; background: #e3e7ef; flex: none; }
    .item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .item .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }
    .item .chips { display: flex; flex-wrap: wrap; gap: 2px; } .item .chips .chip { margin-left: 0; }
    .chip { display: inline-block; font: 800 .7rem Nunito; padding: 1px 7px; border-radius: 99px; background: #eef1f7; color: var(--muted); margin-left: 4px; }
    .chip.warn { background: #fff1d6; color: var(--warn); } .chip.hid { background: #ffe1e1; color: var(--bad); }
    #editCol { padding: 14px 18px 60px; }
    .card { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 2px 0 var(--line); }
    .card > h3 { margin: 0 0 6px; font: 800 1.02rem "Baloo 2", Nunito, sans-serif; display: flex; align-items: center; gap: 8px; }
    .card > h3 .space { flex: 1; }
    .media { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .media img, .media video { width: 220px; max-width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: #e3e7ef; }
    .prog { height: 6px; background: #e3e7ef; border-radius: 99px; overflow: hidden; margin-top: 6px; } .prog i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s; }
    .q { border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; margin: 10px 0; }
    .q .qhead { display: flex; gap: 6px; align-items: center; }
    .q .qhead b { font-size: .85rem; color: var(--muted); }
    .opts .row { margin: 4px 0; }
    .opts input[type=radio] { width: 20px; height: 20px; flex: none; }
    .add-q { display: flex; flex-wrap: wrap; gap: 6px; }
    .problems { margin: 0; padding: 8px 12px 8px 28px; background: #ffe9e9; border-radius: 12px; color: var(--bad); font-weight: 700; }
    .warns { margin: 0; padding: 8px 12px 8px 28px; background: #fff4dc; border-radius: 12px; color: var(--warn); }
    #previewCol { background: #e9edf5; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #previewCol .row { width: 100%; justify-content: center; }
    #frame { width: 390px; height: calc(100vh - 140px); min-height: 560px; border: 0; border-radius: 22px; background: #fff; box-shadow: 0 6px 24px #0002; }
    #frame.wide { width: 100%; }
    .modal { position: fixed; inset: 0; background: #0006; display: grid; place-items: center; z-index: 10; padding: 16px; }
    .modal > div { background: #fff; border-radius: 18px; padding: 16px; max-width: 640px; width: 100%; max-height: 85vh; overflow: auto; }
    .modal h2 { margin: 0 0 8px; font: 800 1.2rem "Baloo 2", Nunito, sans-serif; }
    .ver { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .ver .grow { flex: 1; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .list-item-row { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .list-item-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 800; z-index: 20; }
  </style>
</head>
<body>
<header>
  <h1><img src="/icon.svg" alt="">Angelio Studio <span style="opacity:.75;font-weight:700">· Watch &amp; Sing</span></h1>
  <span class="space"></span>
  <span id="state"></span>
  <button id="historyBtn">🕘 History</button>
  <button id="backupBtn">☁️ Back up now</button>
  <button class="main" id="saveBtn" disabled>Save</button>
</header>
<div class="cols">
  <section id="listCol">
    <div class="tabs" role="tablist">
      <button data-tab="lessons" class="on">📚 Lessons</button><button data-tab="songs">🎵 Songs</button><button data-tab="courses">🎓 Courses</button><button data-tab="albums">💿 Albums</button>
    </div>
    <div class="row"><input id="search" type="search" placeholder="Find…" class="grow"><button class="blue" id="newBtn">+ New</button></div>
    <div id="list" style="margin-top:8px"></div>
  </section>
  <section id="editCol"><div class="empty">Loading the library…</div></section>
  <section id="previewCol">
    <div class="row"><b>Preview</b><span class="muted">(shows changes before you save)</span><button class="small" id="wideBtn">↔ Wider</button><button class="small" id="openLive">Open the live one ↗</button></div>
    <iframe id="frame" title="Watch &amp; Sing preview"></iframe>
  </section>
</div>
<div class="modal" id="keyModal" hidden><div>
  <h2>Admin key</h2><p class="muted">The same key as the sound recorder. It stays on this device.</p>
  <div class="row"><input id="keyIn" type="password" class="grow" autocomplete="current-password"><button class="main" id="keyGo">Open the Studio</button></div>
  <p id="keyErr" class="muted" style="color:var(--bad)"></p>
</div></div>
<div class="modal" id="histModal" hidden><div>
  <div class="row"><h2 class="grow">History</h2><button class="small" data-close>✕ Close</button></div>
  <p class="muted">Every save keeps the version before it. "Bring back" puts that version in the Studio; press Save to make it live again.</p>
  <div id="versions"></div>
</div></div>
<div id="toast" hidden></div>
<script type="module" src="studio.js"></script>
</body>
</html>
