<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watch &amp; Sing</title>
  <meta name="description" content="Free Catholic video lessons for kids, each with a short read-aloud quiz, and songs to sing along with.">
  <meta name="theme-color" content="#ff7a59">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watch &amp; Sing">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html.watch-home { background-color: #f2f9ff; }
    @media (prefers-color-scheme: dark) {
      html.watch-home:not([data-theme="light"]) { background-color: #0f1c33; }
    }
    html.watch-home[data-theme="dark"] { background-color: #0f1c33; }
  </style>
  <script>
    // Saved progress carried over from the old address (see worker/moved.js). Only used if this
    // device has no progress here yet, so it never overwrites anything.
    try {
      var m = location.hash.match(/^#migrate=(.*)$/);
      if (m) { if (!localStorage.getItem("watch:v1")) localStorage.setItem("watch:v1", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + "#/"); }
    } catch (e) {}
    // Paint the correct shell while the module and video library are still loading.
    document.documentElement.classList.toggle("watch-home", /^#?\/?$/.test(location.hash));
  </script>
  <link rel="preload" href="https://angelio.org/fonts/nunito-400-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://angelio.org/fonts/baloo2-400-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://angelio.org/fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://angelio.org/fonts/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="watch-clouds" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <header class="topbar">
    <a class="hub-link" href="https://angelio.org/" aria-label="Angelio home" title="Angelio home"><img src="https://angelio.org/icon.svg" alt="" width="30" height="30"></a>
    <a href="#/" class="brand" aria-label="Watch &amp; Sing home"><span class="logo" aria-hidden="true"></span><span class="watch-brand-name">Watch &amp; Sing</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Play</a>
      <a href="#/grownups" data-nav="grownups" aria-label="For grown-ups">⚙️</a>
    </nav>
  </header>
  <main id="app">
    <section class="hero small-hero watch-loading-hero">
      <h1 class="title">Watch &amp; Sing</h1>
      <p class="lede">Lessons about the Faith, and songs to sing!</p>
    </section>
    <div class="today watch-loading-cards" aria-hidden="true"><span></span><span></span></div>
    <p class="muted center" role="status">Loading…</p>
  </main>
  <div id="fx" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
