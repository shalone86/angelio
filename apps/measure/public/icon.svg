<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#e56b00"/>
    </linearGradient>
    <linearGradient id="ruler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe580"/>
      <stop offset="1" stop-color="#ffc93c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff099"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Tilted ruler in background -->
  <g transform="translate(256 266) rotate(-18)">
    <rect x="-182" y="-120" width="364" height="92" rx="16" fill="#a84300" opacity=".28" transform="translate(0 12)"/>
    <rect x="-182" y="-120" width="364" height="92" rx="16" fill="url(#ruler)" stroke="#7a5200" stroke-width="7"/>
    <g stroke="#7a5200" stroke-width="6" stroke-linecap="round">
      <line x1="-140" y1="-120" x2="-140" y2="-82"/>
      <line x1="-105" y1="-120" x2="-105" y2="-96"/>
      <line x1="-70" y1="-120" x2="-70" y2="-82"/>
      <line x1="-35" y1="-120" x2="-35" y2="-96"/>
      <line x1="0" y1="-120" x2="0" y2="-82"/>
      <line x1="35" y1="-120" x2="35" y2="-96"/>
      <line x1="70" y1="-120" x2="70" y2="-82"/>
      <line x1="105" y1="-120" x2="105" y2="-96"/>
      <line x1="140" y1="-120" x2="140" y2="-82"/>
    </g>
  </g>
  <!-- Analog clock centered -->
  <g transform="translate(226 276)">
    <circle cy="12" r="118" fill="#a84300" opacity=".28"/>
    <circle r="118" fill="#fffdf7" stroke="#135ea9" stroke-width="11"/>
    <circle r="96" fill="none" stroke="#d7e6f7" stroke-width="4" stroke-dasharray="4 16"/>
    <g fill="#2b2340">
      <circle cx="0" cy="-90" r="6"/><circle cx="90" cy="0" r="6"/>
      <circle cx="0" cy="90" r="6"/><circle cx="-90" cy="0" r="6"/>
    </g>
    <!-- Blue minute hand to 12 -->
    <line x1="0" y1="8" x2="0" y2="-74" stroke="#1d7fe0" stroke-width="11" stroke-linecap="round"/>
    <!-- Red hour hand to 3 -->
    <line x1="-8" y1="0" x2="54" y2="0" stroke="#e5484d" stroke-width="13" stroke-linecap="round"/>
    <circle r="12" fill="#2b2340"/>
  </g>
  <!-- Gold coin bottom-right -->
  <g transform="translate(362 356)">
    <circle cy="10" r="66" fill="#8c3d00" opacity=".28"/>
    <circle r="66" fill="url(#coin)" stroke="#9e6b00" stroke-width="7"/>
    <circle r="50" fill="none" stroke="#fff7cc" stroke-width="4"/>
    <path d="M 16 -22 C 6 -28 -10 -24 -16 -10 C -22 6 -14 24 6 26 C 14 27 20 23 24 18" fill="none" stroke="#7a5200" stroke-width="9" stroke-linecap="round"/>
    <line x1="4" y1="-34" x2="4" y2="36" stroke="#7a5200" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
